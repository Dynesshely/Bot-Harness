name: Feature request
description: 建议一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述问题与使用场景，再谈实现方式。与 QQ 平台约束相关的建议请附上依据。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便 / 做不到？谁会遇到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 期望的行为、配置项或接口形态
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: |
        是否会引入新配置、新依赖、数据库迁移或新的平台权限？
        是否能做到「独立开关 + 可按群覆盖 + 可回滚」？
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已搜索过现有 issue / 文档
          required: true
