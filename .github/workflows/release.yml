# 发布：推送 v* tag 时构建并推送容器镜像，同时创建 GitHub Release。
#
# - 镜像：ghcr.io/dynesshely/bot-harness:<tag> 与 :latest
# - 认证：GITHUB_TOKEN（需要 packages:write 与 contents:write）
# - 第三方 actions 全部 pin 到 40 位 commit SHA（tag 只写在行尾注释里方便阅读）：
#   可变 tag 可被上游改写，SHA 不会。升级由 Dependabot（.github/dependabot.yml 的
#   github-actions 项）开 PR，review 后连同注释里的 tag 一起更新。
# - 后续可考虑对构建产物加 provenance / SBOM 证明。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dynesshely/bot-harness

jobs:
  release:
    name: build · push · release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tag 推送会同时触发 CI 与 Release；先等同一个 commit 的 CI 成功，
      # 避免「CI 红但镜像已经发了」。main 上已有成功 CI 时立即通过。
      - name: require green CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            line=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            status=${line%% *}
            conclusion=${line#* }
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              echo "CI is green for $GITHUB_SHA"
              exit 0
            fi
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ] && [ "$conclusion" != "" ]; then
              echo "::error::CI for $GITHUB_SHA concluded $conclusion; refusing to release"
              exit 1
            fi
            echo "waiting for CI ($i/40): ${line:-no run yet}"
            sleep 30
          done
          echo "::error::timed out waiting for green CI for $GITHUB_SHA"
          exit 1

      - name: derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --verify-tag
          fi
