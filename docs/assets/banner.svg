<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Bot Harness — QQ AI bot, single Go binary with embedded Vue 3 admin panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a12"/>
      <stop offset="0.55" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbe6ff"/>
      <stop offset="1" stop-color="#8fb4ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.0"/>
      <stop offset="0.35" stop-color="#4f7cff" stop-opacity="0.65"/>
      <stop offset="0.65" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7aa2ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="0" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <ellipse cx="1250" cy="40" rx="420" ry="300" fill="url(#glowA)"/>
  <ellipse cx="240" cy="420" rx="380" ry="240" fill="url(#glowB)"/>
  <rect x="0" y="0" width="1600" height="420" fill="none" stroke="#8fb4ff" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="0" y="0" width="1600" height="3" fill="url(#edge)"/>

  <!-- left: identity -->
  <g transform="translate(88, 78)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="248" height="34" rx="17" fill="#4f7cff" fill-opacity="0.13" stroke="#6f93ff" stroke-opacity="0.35"/>
      <circle cx="18" cy="17" r="4" fill="#5eead4"/>
      <text x="32" y="22" font-family="'SF Mono','JetBrains Mono','Noto Sans Mono',monospace" font-size="13" fill="#bcd0ff">v0.1.0 · Go 1.27 · Vue 3</text>
    </g>

    <text x="0" y="112" font-family="'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#title)">Bot Harness</text>
    <text x="2" y="158" font-family="'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" fill="#c7d5f2">QQ 群 / 私聊 AI 机器人 · 单二进制 · 内嵌管理后台</text>

    <g transform="translate(0, 196)" font-family="'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15">
      <g>
        <rect x="0" y="0" width="176" height="34" rx="10" fill="#0e1a30" stroke="#2c4270"/>
        <text x="16" y="23" fill="#a9c1ea">QQ Bot API v2</text>
      </g>
      <g transform="translate(190,0)">
        <rect x="0" y="0" width="214" height="34" rx="10" fill="#0e1a30" stroke="#2c4270"/>
        <text x="16" y="23" fill="#a9c1ea">OpenAI 兼容端点</text>
      </g>
      <g transform="translate(418,0)">
        <rect x="0" y="0" width="196" height="34" rx="10" fill="#0e1a30" stroke="#2c4270"/>
        <text x="16" y="23" fill="#a9c1ea">PostgreSQL / SQLite</text>
      </g>
      <g transform="translate(628,0)">
        <rect x="0" y="0" width="168" height="34" rx="10" fill="#0e1a30" stroke="#2c4270"/>
        <text x="16" y="23" fill="#a9c1ea">工具 · 记忆 · 主动</text>
      </g>
    </g>

    <text x="2" y="292" font-family="'SF Mono','JetBrains Mono','Noto Sans Mono',monospace" font-size="14" fill="#6f86ad">Apache-2.0 · self-hosted · github.com/Dynesshely/Bot-Harness</text>
  </g>

  <!-- right: terminal card -->
  <g transform="translate(1010, 74)">
    <rect x="0" y="0" width="500" height="272" rx="18" fill="#070d18" fill-opacity="0.92" stroke="#33517f"/>
    <rect x="0" y="0" width="500" height="44" rx="18" fill="#0c1628"/>
    <rect x="0" y="26" width="500" height="18" fill="#0c1628"/>
    <circle cx="26" cy="22" r="6" fill="#ff6b6b" fill-opacity="0.85"/>
    <circle cx="48" cy="22" r="6" fill="#ffd166" fill-opacity="0.85"/>
    <circle cx="70" cy="22" r="6" fill="#5eead4" fill-opacity="0.85"/>
    <text x="98" y="27" font-family="'SF Mono','JetBrains Mono','Noto Sans Mono',monospace" font-size="12" fill="#6986b5">bot-harness — zsh</text>

    <g font-family="'SF Mono','JetBrains Mono','Noto Sans Mono',monospace" font-size="15">
      <text x="28" y="82" fill="#7dd3fc">$</text>
      <text x="48" y="82" fill="#dbe7ff">docker compose up -d</text>
      <text x="28" y="118" fill="#64748b"># container healthy · admin :8080</text>

      <text x="28" y="156" fill="#5eead4">✔</text>
      <text x="48" y="156" fill="#a9c1ea">gateway</text>
      <text x="140" y="156" fill="#e2e8f0">websocket connected</text>

      <text x="28" y="188" fill="#5eead4">✔</text>
      <text x="48" y="188" fill="#a9c1ea">model</text>
      <text x="140" y="188" fill="#e2e8f0">openai-compatible</text>

      <text x="28" y="220" fill="#5eead4">✔</text>
      <text x="48" y="220" fill="#a9c1ea">panel</text>
      <text x="140" y="220" fill="#e2e8f0">group + c2c synced</text>

      <text x="28" y="252" fill="#7dd3fc">$</text>
      <text x="48" y="252" fill="#dbe7ff">curl -s :8080/api/health</text>
      <text x="340" y="252" fill="#5eead4">200 OK</text>
    </g>
    <rect x="0" y="0" width="500" height="272" rx="18" fill="none" stroke="#6f93ff" stroke-opacity="0.18"/>
  </g>
</svg>