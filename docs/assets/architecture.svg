<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">Bot Harness runtime architecture</title>
  <desc id="desc">Single Go process: QQ gateway and webhook, core pipeline with join gate, message debounce, humanize, affect and expression library, OpenAI compatible chat and embeddings, store, settings, tools, renderer and admin SPA; external QQ platform, OpenAI endpoint, SearxNG sidecar and browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .box { fill: #111c31; stroke: #334155; stroke-width: 1.5; }
      .box-strong { fill: #0f2740; stroke: #0ea5e9; stroke-width: 1.8; }
      .box-ext { fill: #151a24; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .title { fill: #f1f5f9; font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; }
      .sub { fill: #94a3b8; font: 13px ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; }
      .tiny { fill: #64748b; font: 12px ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; }
      .label { fill: #7dd3fc; font: 12px ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #38bdf8; stroke-width: 1.8; marker-end: url(#arrowBlue); }
      .edge-dash { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="720" rx="14"/>
  <text x="40" y="42" class="title">Bot Harness · runtime architecture</text>
  <text x="40" y="64" class="sub">one Go binary, one container · admin SPA embedded · humanlike expression layer</text>

  <!-- external -->
  <rect class="box-ext" x="40" y="108" width="200" height="86" rx="10"/>
  <text x="140" y="140" text-anchor="middle" class="title">QQ 开放平台</text>
  <text x="140" y="163" text-anchor="middle" class="sub">WS gateway / Webhook</text>

  <rect class="box-ext" x="40" y="516" width="200" height="86" rx="10"/>
  <text x="140" y="548" text-anchor="middle" class="title">浏览器</text>
  <text x="140" y="571" text-anchor="middle" class="sub">管理后台（Vue 3 SPA）</text>

  <rect class="box-ext" x="970" y="190" width="230" height="76" rx="10"/>
  <text x="1085" y="220" text-anchor="middle" class="title">OpenAI 兼容端点</text>
  <text x="1085" y="244" text-anchor="middle" class="sub">DeepSeek / 通义 / vLLM</text>

  <rect class="box-ext" x="300" y="440" width="230" height="58" rx="10"/>
  <text x="415" y="464" text-anchor="middle" class="title">SearxNG sidecar</text>
  <text x="415" y="484" text-anchor="middle" class="sub">compose 网络内 · 无宿主端口</text>

  <!-- process -->
  <rect x="290" y="108" width="240" height="112" rx="10" class="box"/>
  <text x="410" y="140" text-anchor="middle" class="title">internal/qq</text>
  <text x="410" y="163" text-anchor="middle" class="sub">API · WS · Webhook</text>
  <text x="410" y="183" text-anchor="middle" class="sub">sender · panels · events</text>

  <rect x="590" y="72" width="330" height="164" rx="10" class="box-strong"/>
  <text x="755" y="104" text-anchor="middle" class="title">internal/core</text>
  <text x="755" y="130" text-anchor="middle" class="sub">dispatcher · turn · reply · agent loop</text>
  <text x="755" y="152" text-anchor="middle" class="sub">join_gate · debounce · humanize · affect</text>
  <text x="755" y="174" text-anchor="middle" class="sub">polish · expressions · memory · proactive</text>
  <text x="755" y="196" text-anchor="middle" class="sub">commands · commitments · human_status</text>
  <text x="755" y="220" text-anchor="middle" class="tiny">policy / dedup / rate limit / context</text>

  <rect x="970" y="88" width="230" height="92" rx="10" class="box"/>
  <text x="1085" y="118" text-anchor="middle" class="title">internal/ai</text>
  <text x="1085" y="142" text-anchor="middle" class="sub">OpenAI protocol · chat</text>
  <text x="1085" y="162" text-anchor="middle" class="sub">embeddings · tools · vision</text>

  <rect x="300" y="300" width="230" height="92" rx="10" class="box"/>
  <text x="415" y="330" text-anchor="middle" class="title">internal/tools</text>
  <text x="415" y="354" text-anchor="middle" class="sub">registry · SSRF guard</text>
  <text x="415" y="374" text-anchor="middle" class="sub">run_shell（双控，默认关）</text>

  <rect x="590" y="300" width="330" height="108" rx="10" class="box"/>
  <text x="755" y="330" text-anchor="middle" class="title">internal/store</text>
  <text x="755" y="354" text-anchor="middle" class="sub">PostgreSQL 17（推荐） / SQLite（回退）</text>
  <text x="755" y="374" text-anchor="middle" class="sub">dialect · migrations · media</text>
  <text x="755" y="394" text-anchor="middle" class="sub">expressions · affect · join decisions</text>

  <rect x="970" y="300" width="230" height="92" rx="10" class="box"/>
  <text x="1085" y="330" text-anchor="middle" class="title">internal/settings</text>
  <text x="1085" y="354" text-anchor="middle" class="sub">运行期配置（存数据库）</text>
  <text x="1085" y="374" text-anchor="middle" class="sub">按群覆盖 · 键集合 golden</text>

  <rect x="970" y="440" width="230" height="72" rx="10" class="box"/>
  <text x="1085" y="468" text-anchor="middle" class="title">internal/render</text>
  <text x="1085" y="492" text-anchor="middle" class="sub">表格 PNG · 内嵌 OFL 字体</text>

  <rect x="300" y="520" width="230" height="88" rx="10" class="box"/>
  <text x="415" y="550" text-anchor="middle" class="title">internal/admin</text>
  <text x="415" y="574" text-anchor="middle" class="sub">REST · SSE · SPA host</text>

  <rect x="590" y="520" width="330" height="88" rx="10" class="box"/>
  <text x="755" y="550" text-anchor="middle" class="title">web/dist（go:embed）</text>
  <text x="755" y="574" text-anchor="middle" class="sub">Vue 3 + Tailwind · 构建产物提交进仓库</text>

  <!-- edges -->
  <path class="edge-blue" d="M 240 151 L 290 151"/>
  <path class="edge-blue" d="M 530 151 L 590 151"/>
  <path class="edge-blue" d="M 920 126 L 970 126"/>
  <path class="edge-blue" d="M 1085 164 L 1085 190"/>
  <path class="edge-blue" d="M 240 559 L 300 559"/>
  <path class="edge-blue" d="M 530 559 L 590 559"/>
  <path class="edge-blue" d="M 530 540 L 562 540 L 562 240 L 590 240"/>
  <path class="edge-blue" d="M 755 236 L 755 300"/>
  <text x="770" y="270" class="tiny">context / expressions</text>
  <path class="edge-blue" d="M 590 200 L 530 200 L 530 300"/>
  <path class="edge" d="M 920 200 L 950 200 L 950 346 L 970 346"/>
  <path class="edge-dash" d="M 415 392 L 415 440"/>
  <path class="edge-dash" d="M 920 230 L 940 230 L 940 476 L 970 476"/>

  <!-- edge labels -->
  <text x="265" y="143" text-anchor="middle" class="label">events</text>
  <text x="560" y="143" text-anchor="middle" class="label">dispatch</text>
  <text x="945" y="118" text-anchor="middle" class="label">chat</text>
  <text x="945" y="551" text-anchor="middle" class="label">serve</text>
  <text x="265" y="551" text-anchor="middle" class="label">HTTP / SSE</text>
  <text x="575" y="470" text-anchor="middle" class="label">REST / SSE</text>
  <text x="430" y="420" text-anchor="middle" class="label">web_search</text>
  <text x="950" y="470" text-anchor="middle" class="label">tables</text>

  <!-- legend -->
  <text x="40" y="670" class="tiny">实线：事件与请求路径 · 虚线：按需/辅助路径</text>
  <text x="40" y="690" class="tiny">配置全部来自数据库；.env 只承载数据库位置、代理与部署键。</text>
</svg>
